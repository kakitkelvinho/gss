<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSS Run Replay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <!-- Top bar: run selector + step slider -->
    <header class="topbar panel">
      <div class="topbar-run">
        <label class="field-label" for="runSelect">Run</label>
        <select id="runSelect" class="control select-run"></select>
      </div>

      <div class="topbar-slider">
        <button id="prevBtn" class="control btn-key" type="button" title="Previous step (Left arrow)">&#9664;</button>
        <button id="playBtn" class="control btn-play" type="button" title="Play from this step">Play</button>
        <button id="pauseBtn" class="control btn-play" type="button" title="Pause playback" disabled>Pause</button>
        <button id="stopBtn" class="control btn-key" type="button" title="Stop and return to step 0">■</button>
        <div class="speed-controls" role="group" aria-label="Playback speed">
          <button class="control btn-speed is-active" type="button" data-speed="1" aria-pressed="true">1×</button>
          <button class="control btn-speed" type="button" data-speed="2" aria-pressed="false">2×</button>
          <button class="control btn-speed" type="button" data-speed="4" aria-pressed="false">4×</button>
        </div>
        <input id="stepSlider" class="slider" type="range" min="0" max="0" value="0" step="1">
        <button id="nextBtn" class="control btn-key" type="button" title="Next step (Right arrow)">&#9654;</button>
        <div id="stepLabel" class="step-readout">Step 0 / 0</div>
      </div>
      <div class="run-counters" aria-live="off">
        <div class="run-counter"><span>Lab time</span><strong id="labClock">00:00:00 / 04:00:00</strong></div>
        <div class="run-counter"><span>Spent</span><strong id="moneyCounter">€0</strong></div>
      </div>
    </header>

    <!-- Main workspace: Left = Top-down optical table, Right = Selected tool call + Final diagnostics -->
    <main class="workspace">
      <section class="stage-panel panel">
        <div class="stage-bar">
          <div class="stage-legend">
            <span class="legend-title">Optical table (2400 &times; 1200 mm)</span>
            <span class="legend-sep">&middot;</span>
            <span class="beam-key"><span class="swatch swatch-800"></span><span id="leg800">800 nm: closed</span></span>
            <span class="beam-key"><span class="swatch swatch-opa"></span><span id="legOpa">OPA: closed</span></span>
          </div>
          <div class="stage-tools">
            <span id="cursorReadout" class="coord-readout">x —, z — mm</span>
            <button id="fitBtn" class="control btn-sm" type="button" title="Reset zoom &amp; pan (R)">Fit view</button>
          </div>
        </div>
        <div class="view-stack">
          <div class="iso-wrap">
            <div class="view-caption"><strong>Isometric lab</strong><span id="isoAction">Researcher at desk</span></div>
            <canvas id="isoCanvas" aria-label="Fixed isometric view of the lab"></canvas>
          </div>
          <div class="canvas-wrap">
            <div class="view-caption"><strong>Top-down plan</strong><span>Exact x / z positions</span></div>
            <canvas id="tableCanvas" aria-label="Top-down optical table"></canvas>
            <div id="partTooltip" class="tooltip" hidden></div>
          </div>
        </div>
      </section>

      <aside class="side-col">
        <!-- Selected tool call -->
        <section class="call-panel panel">
          <div class="section-head">
            <h2 class="section-title">Steps (tool calls)</h2>
            <span id="callTime" class="mono-meta">00:00</span>
          </div>
          <div id="callList" class="call-list" aria-label="Tool call history"></div>
          <div id="callBody" class="call-body"></div>
        </section>

        <!-- Final diagnostics -->
        <section class="diag-panel panel">
          <div class="section-head">
            <h2 class="section-title">Final diagnostics</h2>
            <span id="endedBadge" class="badge">—</span>
          </div>
          <div id="diagMetrics" class="metrics-grid"></div>
          <div id="diagMeta" class="diag-meta"></div>
          <div id="diagTags" class="tags-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="runs_bundle.js"></script>
  <script src="render_iso.js"></script>
  <script src="app.js"></script>
</body>
</html>
