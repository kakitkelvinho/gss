[project]
name = "gss"
version = "0.1.0"
description = "GSS: Find Time Zero, a pump-probe alignment RL environment (Harbor task)"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
server = [
    "fastmcp==4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "server/tests"]
pythonpath = ["."]

[tool.uv]
package = false
default-groups = ["dev", "server"]
